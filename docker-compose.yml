version: '3.8'

services:
  bot:
    build: .
    container_name: pp_helper_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./sqlite.db:/app/sqlite.db
    command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
